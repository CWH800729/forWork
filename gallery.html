<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>照片縮圖</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="gallery-page">
  <header class="app-header compact">
    <a class="back-link" href="search.html">返回查詢</a>
    <div>
      <p class="eyebrow">Gallery</p>
      <h1>照片縮圖</h1>
    </div>
  </header>

  <main class="gallery-main">
    <div class="gallery-toolbar">
      <p id="galleryMessage" class="gallery-message" role="status">正在載入縮圖...</p>
      <div class="gallery-selection-actions desktop-only">
        <button id="selectAllButton" class="selection-button" type="button">全選</button>
        <button id="clearSelectionButton" class="selection-button" type="button">取消全選</button>
        <button id="bulkDownloadButton" class="bulk-download-button" type="button" disabled>
          打包下載
        </button>
      </div>
    </div>
    <div id="archiveLinks" class="archive-links desktop-only" aria-live="polite"></div>
    <section id="galleryGrid" class="gallery-grid" aria-live="polite"></section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
