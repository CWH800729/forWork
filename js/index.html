<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工地照片管理</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">Construction Photo Manager</p>
      <h1>工地照片管理</h1>
    </div>
  </header>

  <main class="home">
    <section class="action-panel">
      <h2>今天要做什麼？</h2>
      <div class="home-actions">
        <a class="primary-action" href="upload.html">照片上傳</a>
        <a class="secondary-action" href="search.html">照片查詢</a>
      </div>
    </section>

    <section class="status-strip">
      <div>
        <strong>照片</strong>
        <span>存到 Google Drive</span>
      </div>
      <div>
        <strong>索引</strong>
        <span>寫入 Google Sheets</span>
      </div>
      <div>
        <strong>網站</strong>
        <span>部署於 GitHub Pages</span>
      </div>
    </section>
  </main>

</html>
