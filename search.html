<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>照片查詢</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header compact">
    <a class="back-link" href="index.html">首頁</a>
    <div>
      <p class="eyebrow">Search</p>
      <h1>照片查詢</h1>
    </div>
  </header>

  <main>
    <form id="searchForm" class="form-panel">
      <div class="field-grid">
        <label>
          起始日期
          <input id="dateFrom" name="dateFrom" type="date">
        </label>
        <label>
          結束日期
          <input id="dateTo" name="dateTo" type="date">
        </label>
        <label>
          樓層
          <span class="input-suffix">
            <input id="floor" name="floor" type="number" inputmode="numeric" min="1" max="25" step="1" placeholder="全部">
            <span>F</span>
          </span>
        </label>
        <label>
          區域
          <input id="area" name="area" type="text" maxlength="30" placeholder="全部">
        </label>
        <label>
          工項
          <select id="trade" name="trade"></select>
        </label>
        <label>
          分類
          <select id="category" name="category"></select>
        </label>
      </div>

      <label>
        關鍵字
        <input id="keyword" name="keyword" type="search" placeholder="樓層、區域、工項、檔名或備註">
      </label>

      <button class="submit-button" type="submit">搜尋</button>
      <p id="searchMessage" class="message" role="status"></p>
    </form>

    <section class="search-results" aria-live="polite">
      <div id="results"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
