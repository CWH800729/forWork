<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>施工照片上傳</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header compact">
    <a class="back-link" href="index.html">首頁</a>
    <div>
      <p class="eyebrow">Upload</p>
      <h1>施工照片上傳</h1>
    </div>
  </header>

  <main>
    <form id="uploadForm" class="form-panel">
      <label>
        日期
        <input id="photoDate" name="date" type="date" required>
      </label>

      <div class="field-grid">
        <div class="field-group">
          <span class="field-label">樓層／節次</span>
          <div class="floor-control">
            <input id="floor" name="floor" type="number" inputmode="numeric" min="1" max="25" step="1" placeholder="5" aria-label="樓層或節次數字" required>
            <div class="unit-toggle" aria-label="樓層或節次">
              <label><input name="floorType" type="radio" value="F" checked><span>F</span></label>
              <label><input name="floorType" type="radio" value="#"><span>#</span></label>
            </div>
          </div>
        </div>
        <label>
          區域
          <input id="area" name="area" type="text" maxlength="30" placeholder="例如：A區" list="personalAreas" required>
          <datalist id="personalAreas"></datalist>
        </label>
        <div class="field-group">
          <span class="field-label">工項</span>
          <div class="custom-field-row">
            <select id="trade" name="trade" required></select>
            <button id="toggleCustomTrade" class="custom-toggle-button" type="button" aria-pressed="false">自訂</button>
          </div>
          <input id="customTrade" type="text" maxlength="40" placeholder="輸入自訂工項" hidden disabled>
        </div>
        <label>
          分類
          <select id="category" name="category" required></select>
        </label>
      </div>

      <label>
        備註
        <textarea id="note" name="note" rows="3" placeholder="例如：C3柱柱接頭"></textarea>
      </label>

      <label class="file-picker">
        <span>拍照 / 選擇照片</span>
        <input id="photos" name="photos" type="file" accept="image/*" multiple required>
      </label>

      <div class="selected-row">
        <span id="selectedCount">尚未選擇照片</span>
        <button id="clearPhotos" class="text-button" type="button">清除</button>
      </div>

      <div id="previewGrid" class="preview-grid" aria-live="polite"></div>

      <button id="uploadButton" class="submit-button" type="submit">上傳照片</button>
      <p id="uploadMessage" class="message" role="status"></p>
    </form>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/upload.js"></script>
</body>
</html>
